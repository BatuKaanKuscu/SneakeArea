services:
  - type: web
    name: snake-area
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATA_DIR
        value: /opt/render/project/src/storage
    disk:
      name: snake-area-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    autoDeployTrigger: commit