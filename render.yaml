services:
  - type: web
    name: snake-area
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: snake-area-data
      mountPath: /var/data
      sizeGB: 1
    autoDeployTrigger: commit